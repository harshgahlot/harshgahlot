name: generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *" # daily at midnight UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake animations
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#a5b40b&color_dots=#ebedf0,#c5cf6c,#a5b40b,#7c8a00,#4d5606
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#D9F24F&color_dots=#1b1f23,#39421a,#5c6b1f,#98ad2f,#D9F24F

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
